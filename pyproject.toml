[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltaxl"
version = "0.1.0"
description = "Quantitative comparison of crosslinking mass spectrometry (XL-MS) datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jens Hieronymus" }]
keywords = ["XL-MS", "crosslinking", "mass spectrometry", "proteomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    # GUI is the standard on Windows; on Linux it is optional (see [gui] below)
    "PySide6; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["PySide6"]   # Linux: pip install "deltaxl[gui]"
dev = ["pytest"]

[project.scripts]
deltaxl = "deltaxl.cli:main"

[project.gui-scripts]
deltaxl-gui = "deltaxl.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
